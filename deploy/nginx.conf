upstream django {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name your-domain.ru; // Замените на реальный

    client_max_body_size 100M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Статика Django (admin, DRF)
    location /static/ {
        alias /var/www/mycloud/backend/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы
    location /media/ {
        alias /var/www/mycloud/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API и аутентификация → Django
    location ~ ^/(api|admin|login|logout|test)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # SPA: всё остальное отдаём как index.html, а React Router разберётся
    location / {
        root /var/www/mycloud/backend/static;
        try_files $uri $uri/ /index.html;
    }
}
